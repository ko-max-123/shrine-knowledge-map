# 神紋ノード追加データ（GitHub Pages対応）
# type: concept は既存アプリの「信仰・概念」に対応。HTMLやJSの修正は不要。
# 1件ずつ id / type / name / reading / short / description / tags を編集できます。

- id: shinmon
  type: concept
  name: 神紋・社紋
  reading: しんもん・しゃもん
  short: 神社に伝わる紋章を、図柄・由来・神社から探る
  description: |
    神社に用いられる紋章は神紋・社紋などと呼ばれます。祭神に関わる神話や伝承、境内にゆかりのある植物、神職やゆかりの氏族の家紋などが図柄となっています。
    このマップでは動画で紹介された題材を中心に、神社と紋様、その由来の関係をたどれます。神社ごとに正式な呼び方や図柄の細部が異なる場合があります。
  tags:
    - 神紋
    - 社紋
    - 神社の意匠

- id: crest_origin_nature
  type: concept
  name: 植物・神木に由来する神紋
  reading: しょくぶつ・しんぼく
  short: 杉・梅・藤・葵・稲などの意匠
  description: |
    神社や祭神にゆかりのある植物・神木を図案化した神紋の系統。杉、梅、葵、藤、稲、梶の葉などがよく知られています。植物の形そのものだけでなく、信仰や祭礼の歴史も背景になります。
  tags:
    - 神木
    - 植物
    - 祭祀

- id: crest_origin_legend
  type: concept
  name: 神話・伝承に由来する神紋
  reading: しんわ・でんしょう
  short: 八咫烏や梅の伝承など
  description: |
    神話に登場する存在や、祭神にまつわる伝承を表した紋章の系統。八咫烏は神武東征の道案内の故事、天満宮の梅は菅原道真と梅の伝承に結び付けて紹介されます。
  tags:
    - 神話
    - 伝説
    - 故事

- id: crest_origin_family
  type: concept
  name: 家紋・氏族に由来する神紋
  reading: かもん・しぞく
  short: 宮司家・武家・氏族とのつながり
  description: |
    神職家や氏族、歴史上の人物の家紋が、神社の紋章として用いられる例があります。出雲大社の亀甲紋、東照宮の葵紋、湊川神社の菊水紋などは、その由来をたどる入口になります。
  tags:
    - 家紋
    - 氏族
    - 歴史人物

- id: crest_yatagarasu
  type: concept
  name: 八咫烏紋
  reading: やたがらすもん
  short: 熊野本宮大社にゆかりの三本足の烏
  description: |
    三本足の烏「八咫烏」は熊野信仰を象徴する意匠として知られ、熊野本宮大社では神武天皇を大和へ導いた存在として説明されています。三本の足には天・地・人を表すという解釈が伝えられています。
  tags:
    - 熊野本宮大社
    - 八咫烏
    - 神武東征

- id: crest_mitsusugi
  type: concept
  name: 三ツ杉（三本杉）紋
  reading: みつすぎ・さんぼんすぎ
  short: 大神神社の社紋、神木の杉に由来
  description: |
    大神神社（奈良県桜井市）の社紋。杉を三本並べた図柄で、大神神社の公式サイトでも「三ツ杉」と表記されています。三輪山や神杉への信仰と結び付きます。
  tags:
    - 大神神社
    - 三輪山
    - 神杉

- id: crest_kikko_kenhanabishi
  type: concept
  name: 二重亀甲に剣花菱
  reading: にじゅうきっこうにけんはなびし
  short: 出雲大社の神紋、六角形と剣花菱
  description: |
    出雲大社で用いられる紋章。亀の甲羅を思わせる二重の六角形の中に、剣花菱が配されます。神職家・国造家の家紋との関係があり、古い形では亀甲の中に「有」の字を置いたものも伝わります。亀甲の象徴については複数の解釈があります。
  tags:
    - 出雲大社
    - 亀甲
    - 剣花菱

- id: crest_kikko_ari
  type: concept
  name: 亀甲に「有」の字
  reading: きっこうにありのじ
  short: 出雲大社に伝わる古い紋章の形
  description: |
    出雲大社に伝わる古い亀甲紋の一形態。剣花菱ではなく「有」の字が中に書かれた例があり、神々が集うとされる神在月とのつながりを説く説明があります。現行の二重亀甲に剣花菱と区別して扱います。
  tags:
    - 出雲大社
    - 古い神紋
    - 神在月

- id: crest_ume
  type: concept
  name: 梅紋・梅鉢紋
  reading: うめもん・うめばちもん
  short: 天満宮の梅、菅原道真の故事
  description: |
    天満宮系の神社で広く用いられる梅の紋。菅原道真が梅を好んだという伝承と結び付きます。梅花や梅鉢など、個別の天満宮で図柄が異なるため、すべての天満宮が同一の紋を用いるわけではありません。
  tags:
    - 天満宮
    - 菅原道真
    - 梅

- id: crest_mitsutomo
  type: concept
