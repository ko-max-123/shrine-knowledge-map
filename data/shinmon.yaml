  short: 八幡信仰でも知られる渦巻き状の紋
  description: |
    三つの巴が回転するように組み合わさった文様。八幡社などで広く見られます。石清水八幡宮の御神紋は「流れ左三つ巴紋」と案内されています。図柄の由来には水の渦など諸説があり、一つに確定していません。
  tags:
    - 八幡宮
    - 巴紋
    - 流れ左三つ巴

