    上賀茂神社・下鴨神社にゆかりの二葉葵を表す紋章。上賀茂神社は、祭神降臨の伝承と葵を飾る神託を御神紋の由来として説明しています。徳川家の三つ葉葵とは図柄を区別します。
  tags:
    - 上賀茂神社
