    - 大分
    - 八幡造
- id: iwashimizu
  type: shrine
  name: 石清水八幡宮
  reading: いわしみずはちまんぐう
  short: 八幡造の代表例
  description: |
    京都府八幡市に鎮座する神社。本社の建築は八幡造を理解する代表的な例です。
  tags:
    - 京都
