- id: hiyoshi
  type: shrine
  name: 日吉大社
  reading: ひよしたいしゃ
  short: 日吉造の代表例
  description: |
    滋賀県大津市に鎮座する神社。特有の社殿建築形式「日吉造」を伝えることで知られます。
  tags:
