- id: nikko
  type: shrine
  name: 日光東照宮
  reading: にっこうとうしょうぐう
  short: 権現造の代表例
  description: |
    栃木県日光市に鎮座し徳川家康を祀る神社。本殿・石の間・拝殿の連結構成をもつ権現造で知られます。
