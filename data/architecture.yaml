- id: usa
  type: shrine
  name: 宇佐神宮
  reading: うさじんぐう
  short: 八幡造の代表例
  description: |
    大分県宇佐市に鎮座する八幡宮の総本宮として知られる神社。本殿は八幡造の代表例です。
