  description: |
    明治期に整備された神社の社格制度。官幣社・国幣社（各大・中・小）や府県社・郷社・村社などの区分がありましたが、戦後に廃止されました。現在の神社の法的な上下関係を示すものではありません。
  tags:
    - 明治
    - 旧社格
    - 戦後廃止
