- id: engishiki
  type: rank
  name: 延喜式神名帳
  reading: えんぎしきじんみょうちょう
  short: 927年完成の『延喜式』所収の名簿
  description: |
    平安時代の法制書『延喜式』の巻九・十に収録された神社の名簿。2,861社・3,132座が記載されており、これに記載された神社を式内社と呼びます。現在の神社名と記載名の比定には異説もあります。
  tags:
    - 平安時代
    - 927年
    - 2861社
- id: shikinaisha
  type: rank
  name: 式内社
  reading: しきないしゃ
  short: 延喜式神名帳に記載された神社
  description: |
    『延喜式神名帳』に掲載された神社を指す歴史的な呼称。神社が現在も同じ場所・同じ名前で続いているとは限らず、現存社との比定には調査が必要です。
  tags:
    - 古代
    - 延喜式
- id: shikigesha
  type: rank
  name: 式外社
  reading: しきげしゃ
  short: 延喜式神名帳に載らない神社
  description: |
    『延喜式神名帳』に記載されていない神社を指す呼称。記載がないことだけで、創建の新しさや信仰の大小を判断できるものではありません。
  tags:
    - 古代
    - 延喜式
