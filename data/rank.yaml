    - 古代
    - 社格
- id: shikinaisha_shosha
  type: rank
  name: 小社（延喜式）
  reading: しょうしゃ
  short: 式内社の大社・小社の区分
  description: |
    『延喜式』における官社の大社・小社のうち小社を指します。「社」という名称の大小や現代の規模ではありません。
  tags:
    - 古代
    - 社格
- id: ancient_kanpei
  type: rank
  name: 官幣社（古代）
  reading: かんぺいしゃ
  short: 神祇官を通じた奉幣に関わる区分
  description: |
    古代律令制下で神祇官から奉幣を受ける官社の区分。明治期の「官幣社」とは制度が異なるため、このマップでは分けて扱います。
  tags:
    - 古代
    - 奉幣
- id: ancient_kokuhei
  type: rank
  name: 国幣社（古代）
  reading: こくへいしゃ
  short: 国司を通じた奉幣に関わる区分
  description: |
    古代律令制下で国司などから奉幣を受ける官社の区分。明治期の同名の社格とは制度上の文脈が異なります。
  tags:
    - 古代
    - 奉幣
- id: ichinomiya
  type: rank
  name: 一宮
  reading: いちのみや
  short: 各国で特に崇敬された神社の称
  description: |
    平安後期以降に各国で特に重んじられた神社を指す歴史的呼称。全国一律の単一制度ではなく、国・地域ごとに形成されました。式内社や近代社格とは別の軸です。
  tags:
    - 中世
    - 各国
- id: modern_rank
  type: rank
  name: 近代社格制度
