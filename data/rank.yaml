  type: rank
  name: 大社（延喜式）
  reading: たいしゃ
  short: 式内社の大社・小社の区分
  description: |
    『延喜式』の官社にみられる大社・小社の区分のうち、大社を指します。大社という社号（神社名の一部）とは意味が異なります。
