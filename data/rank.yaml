  short: 古代の名神祭と大社に関わる区分
  description: |
    式内社のうち、名神祭の対象となる「名神」に数えられ、大社にも分類される神社。近代の「官幣大社」とは別の時代の区分です。
  tags:
    - 古代
    - 式内社
    - 名神
