# 基本の神社・神様・神宝・中心カテゴリ
# 1ブロック＝1件。項目の追加・変更・削除はこのファイルだけで可能です。

- id: world
  type: concept
  name: 神社の世界
  reading: じんじゃのせかい
  short: 建築・社格・神様・神宝・祭祀をつなぐ知識の入口
  description: |
    神社の建築、歴史的な社格・式内社、祀られる神々、神宝、境内の施設を関係線でたどる知識マップです。円をクリックすると説明が横に開き、ダブルクリックするとその円が新しい中心になります。
  tags:
    - 神社建築
    - 社格
    - 式内社
    - 神話
    - 神宝
    - 祭祀
- id: ise
  type: shrine
  name: 伊勢神宮
  reading: いせじんぐう
  short: 内宮・外宮を中心とする神宮
  description: |
    三重県伊勢市に鎮座する神宮。皇大神宮（内宮）と豊受大神宮（外宮）の両正宮を中心に、別宮など多くのお宮から成ります。「伊勢神宮」は通称で、正式名称は「神宮」です。
  tags:
    - 三重県伊勢市
    - 内宮と外宮
    - 正式名称：神宮
- id: naiku
  type: shrine
  name: 皇大神宮（内宮）
  reading: こうたいじんぐう（ないくう）
  short: 天照大御神をお祀りする
  description: |
    伊勢神宮の内宮。天照大御神をお祀りし、八咫鏡をご神体として奉斎すると伝えられています。五十鈴川のほとりに鎮座しています。
  tags:
    - 三重県伊勢市
    - 御祭神：天照大御神
    - 伊勢神宮の内宮
- id: geku
  type: shrine
  name: 豊受大神宮（外宮）
  reading: とようけだいじんぐう（げくう）
  short: 豊受大御神をお祀りする
  description: |
    伊勢神宮の外宮。天照大御神の御饌都神（みけつかみ）として、豊受大御神をお祀りしています。衣食住や産業に関わる信仰でも親しまれています。
  tags:
    - 三重県伊勢市
    - 御祭神：豊受大御神
    - 伊勢神宮の外宮
- id: toy
  type: kami
  name: 豊受大御神
  reading: とようけのおおみかみ
  short: 食物・衣食住を司る神
  description: |
    伊勢神宮の外宮にお祀りされる神。天照大御神のお食事を司る御饌都神とされ、衣食住や産業を支える存在として信仰されています。
  tags:
    - 外宮の御祭神
    - 御饌都神
- id: ama
  type: kami
  name: 天照大御神
  reading: あまてらすおおみかみ
  short: 太陽にもたとえられる神
  description: |
    日本神話に登場する神で、伊勢神宮の内宮にお祀りされています。神話では素戔嗚尊と姉弟の関係にあり、三種の神器の一つである八咫鏡とも深いつながりがあります。
  tags:
    - 内宮の御祭神
    - 皇室の御祖神
    - 日本神話
- id: yata
  type: treasure
  name: 八咫鏡
  reading: やたのかがみ
  short: 三種の神器・神鏡
  description: |
    三種の神器の一つ。神話に登場する神鏡で、伊勢神宮の内宮では八咫鏡をご神体としてお祀りすると伝えられています。
  tags:
    - 三種の神器
    - 鏡
    - 内宮との縁
- id: sanshu
  type: concept
  name: 三種の神器
  reading: さんしゅのじんぎ
  short: 鏡・剣・勾玉の三つ
  description: |
    皇位のしるしとして伝えられる三つの宝物。八咫鏡・草薙剣・八坂瓊勾玉を指します。神話と祭祀を理解するうえで重要な概念です。
  tags:
    - 八咫鏡
    - 草薙剣
    - 八坂瓊勾玉
- id: magatama
  type: treasure
  name: 八坂瓊勾玉
  reading: やさかにのまがたま
  short: 三種の神器・勾玉
  description: |
    三種の神器の一つに数えられる勾玉。鏡や剣とともに皇位のしるしとして伝えられています。
  tags:
    - 三種の神器
    - 勾玉
- id: sword
  type: treasure
  name: 草薙神剣
  reading: くさなぎのみつるぎ
  short: 三種の神器・神剣
  description: |
    三種の神器の一つ。日本神話では素戔嗚尊が八岐大蛇を退治した際に得た剣に由来すると伝えられます。熱田神宮にお祀りされる神剣です。
  tags:
    - 三種の神器
    - 神話の剣
    - 熱田神宮との縁
- id: atsuta
  type: shrine
  name: 熱田神宮
  reading: あつたじんぐう
  short: 草薙神剣をお祀りする
  description: |
    愛知県名古屋市に鎮座する神宮。草薙神剣をご神体としてお祀りし、主祭神は熱田大神です。熱田大神は、神剣を御霊代とする天照大神と説明されています。
  tags:
    - 愛知県名古屋市
    - 主祭神：熱田大神
    - 草薙神剣
- id: susanoo
  type: kami
  name: 素戔嗚尊
  reading: すさのおのみこと
  short: 八岐大蛇の神話で知られる
  description: |
    日本神話に登場する神。天照大御神の弟神とされ、八岐大蛇（やまたのおろち）を退治して剣を得た神話で知られます。京都の八坂神社では主祭神としてお祀りされています。
  tags:
    - 日本神話
    - 八岐大蛇
    - 八坂神社の主祭神
- id: yasaka
  type: shrine
  name: 八坂神社
  reading: やさかじんじゃ
  short: 祇園信仰と素戔嗚尊
  description: |
    京都・祇園に鎮座する神社。素戔嗚尊を主祭神とし、祇園祭で広く知られています。疫病退散への祈りと関わる歴史があります。
  tags:
    - 京都府京都市
    - 主祭神：素戔嗚尊
    - 祇園祭
- id: okuni
  type: kami
  name: 大国主大神
  reading: おおくにぬしのおおかみ
  short: 国づくりと縁結びの神
  description: |
    出雲大社の御祭神。「国づくり」の神話で知られ、縁結びの神としても広く信仰されています。出雲の神話世界の中心となる神の一柱です。
  tags:
    - 出雲大社の御祭神
    - 国づくり
    - 縁結び
- id: izumo
  type: shrine
  name: 出雲大社
  reading: いづもおおやしろ
  short: 大国主大神をお祀りする
  description: |
    島根県出雲市に鎮座する神社。大国主大神をお祀りし、国づくりや縁結びなどに関する信仰が広く伝わっています。
  tags:
    - 島根県出雲市
    - 御祭神：大国主大神
    - 縁結び
- id: uka
  type: kami
  name: 宇迦之御魂大神
  reading: うかのみたまのおおかみ
  short: 稲荷信仰に深く関わる神
  description: |
    伏見稲荷大社の本殿でお祀りされる五柱の祭神の一柱。下社の中央座に鎮まるとされ、稲荷信仰と深いつながりがあります。
  tags:
    - 伏見稲荷大社の御祭神
    - 稲荷信仰
- id: inari
  type: concept
  name: 稲荷信仰
  reading: いなりしんこう
  short: 稲荷大神を敬う信仰
  description: |
    稲荷大神への信仰。稲作と深い関わりをもち、時代とともに商売繁昌・家内安全など多様な願いと結びついてきました。伏見稲荷大社が代表的な神社です。
  tags:
    - 稲作
    - 商売繁昌
    - 全国に広がる信仰
- id: fushimi
  type: shrine
  name: 伏見稲荷大社
  reading: ふしみいなりたいしゃ
  short: 稲荷大神をお祀りする総本宮
  description: |
    京都・稲荷山に鎮座する神社。全国に広がる稲荷神社の総本宮として知られ、本殿には宇迦之御魂大神を含む五柱の神々がお祀りされています。
  tags:
    - 京都府京都市
    - 稲荷信仰
    - 宇迦之御魂大神ほか
- id: architecture
  type: architecture
  name: 神社の建築様式
  reading: じんじゃのけんちくようしき
  short: 神明造・大社造・流造など
  description: |
    本殿の屋根の形、入口の向き、建物のつながり方などで分類される社殿の様式。神社全体ではなく、本殿や拝殿など、どの建物の形式なのかを区別して理解します。
  tags:
    - 本殿
    - 平入
    - 妻入
- id: shikaku
  type: rank
  name: 式内社と社格
  reading: しきないしゃとしゃかく
  short: 古代と近代の神社の制度
  description: |
    式内社は平安時代の『延喜式神名帳』への記載を示す歴史的呼称です。一方、社格は時代ごとに形を変えた神社の格式・制度を指します。現在の神社に旧制度の等級をそのまま当てはめるものではありません。
  tags:
    - 式内社
    - 社格
    - 歴史
- id: shrines
  type: concept
  name: 神社とその由緒
  reading: じんじゃとそのゆいしょ
  short: 伊勢・出雲などの代表的な神社
  description: |
    神社の名前、祭神、社殿、歴史的な制度は相互につながっています。代表的な神社から建築様式や信仰へ進めます。
  tags:
    - 神宮
    - 大社
    - 社号
- id: deities
  type: concept
  name: 神々と神話
  reading: かみがみとしんわ
  short: 祭神と日本神話の関係
  description: |
    神社で祀られる神々と日本神話の物語を関連づけて眺めます。神話に登場する神の関係と、実際の神社の御祭神という関係は区別します。
  tags:
    - 祭神
    - 神話
- id: treasures
  type: concept
  name: 神宝と神具
  reading: しんぽうとしんぐ
  short: 三種の神器など
  description: |
    神話や祭祀に登場する神宝、神体、祭具の関係をたどります。同じ名称でも神話上の記述と現実の祭祀は区別します。
  tags:
    - 三種の神器
    - 御神体
- id: keidai
  type: concept
  name: 境内と祭祀
  reading: けいだいとさいし
  short: 本殿・拝殿・祭祀
  description: |
    鳥居から本殿までの境内構成と祭祀を支える施設を見ていく入口です。神社によって社殿の配置や有無は異なります。
  tags:
    - 本殿
    - 拝殿
    - 鳥居
